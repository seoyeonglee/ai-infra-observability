groups:
  - name: ai-infra-observability
    rules:
      - alert: AIServiceUnavailable
        expr: up{job="ai-observability-api"} == 0
        for: 1m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "AI service target is unavailable"
          description: "Prometheus cannot scrape the AI observability service."

      - alert: HighInferenceLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(ai_service_request_duration_seconds_bucket{route="/api/v1/inference"}[5m]))
          ) > 1
        for: 2m
        labels:
          severity: warning
          component: inference
        annotations:
          summary: "Inference API p95 latency is elevated"
          description: "p95 request latency exceeded 1 second for 2 minutes."

      - alert: High5xxErrorRate
        expr: |
          (
            sum(rate(ai_service_requests_total{route="/api/v1/inference",status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(ai_service_requests_total{route="/api/v1/inference"}[5m])), 0.001)
          ) > 0.05
        for: 2m
        labels:
          severity: critical
          component: inference
        annotations:
          summary: "Inference API 5xx error ratio is above 5%"
          description: "Correlate with structured application logs before remediation."

      - alert: HighInferenceQueueDepth
        expr: ai_inference_queue_depth > 10
        for: 3m
        labels:
          severity: warning
          component: inference
        annotations:
          summary: "Inference queue depth is elevated"
          description: "Queue depth exceeded 10 for 3 minutes."
